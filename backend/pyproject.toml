[project]
name = "investment-tracker-backend"
version = "0.1.0"
description = "Local-first multi-broker investment tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "ib_async>=1.0",
    "yfinance>=0.2.43",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
ai = [
    "mcp>=2.0",
    "ollama>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"
