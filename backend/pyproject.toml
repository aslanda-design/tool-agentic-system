[project]
name = "investment-tracker-backend"
version = "0.1.0"
description = "Local-first multi-broker investment tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "ib_async>=1.0",
    "yfinance>=0.2.43",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    # SQLAlchemy Vector type for the tool_index table (plans/tool_rag.md) —
    # a hard dependency, not an optional extra, because
    # app/adapters/persistence/orm.py imports it unconditionally (every
    # model must be registered on Base.metadata for Alembic to see it).
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
ai = [
    "mcp>=2.0",
    "ollama>=0.5",
]
quant = [
    "numpy>=2.0",
    "statsmodels>=0.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # FastAPI's DI pattern is exactly `param: X = Depends(get_x)` — a
    # function call in a default argument is the whole mechanism, not a
    # mutable-default bug.
    "B008",
    # This app works in pure `date` (trading days / calendar days), never
    # `datetime`, by domain convention — see backend/AGENTS.md. DTZ011/DTZ007
    # want `date.today()`/`strptime()` replaced with a tz-aware datetime,
    # which would reintroduce a concept (time-of-day, timezone) this domain
    # deliberately has no use for.
    "DTZ011",
    "DTZ007",
]

[tool.ruff.lint.per-file-ignores]
# yfinance is an unofficial scraper with no documented exception types and
# no stable schema (see backend/AGENTS.md's "Known limitations") — a bare
# `except Exception` here is deliberate defensive coding against an
# unreliable third-party surface, not a swallowed real bug.
"app/adapters/market_data/yfinance_adapter.py" = ["BLE001", "S112"]
"app/adapters/market_intel/yfinance_news_adapter.py" = ["BLE001"]
